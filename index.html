<!DOCTYPE html>
<html>
<head>

<title>DCT MINI BOT</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}


body{

    min-height:100vh;
    background:
    linear-gradient(
    rgba(0,0,0,.55),
    rgba(0,0,0,.85)
    ),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    color:white;

}


.menu{

position:absolute;
right:25px;
top:25px;

width:65px;
height:65px;

background:rgba(0,0,0,.5);

backdrop-filter:blur(10px);

border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

font-size:32px;

color:#00aaff;

}



.container{

width:90%;
max-width:500px;

margin:70px auto;

padding:35px;

background:rgba(10,20,35,.65);

backdrop-filter:blur(15px);

border-radius:35px;

border:1px solid rgba(255,255,255,.2);

box-shadow:
0 0 40px #0066ff;

text-align:center;

animation:show 1s;


}



@keyframes show{

from{

opacity:0;
transform:translateY(50px);

}

to{

opacity:1;
transform:none;

}

}



.logo{

width:140px;
height:140px;

border-radius:50%;

border:5px solid #00aaff;

box-shadow:0 0 30px #00aaff;

}



h1{

margin-top:25px;

font-size:38px;

}


h1 span{

color:#00aaff;

}



.sub{

letter-spacing:5px;

color:#aaa;

margin-top:10px;

}



.line{

height:4px;
width:100px;

background:#00aaff;

margin:25px auto;

border-radius:20px;

}



.feature{

background:rgba(0,0,0,.5);

padding:18px;

border-radius:30px;

margin-bottom:20px;

}



button{

width:100%;

padding:18px;

margin:10px 0;

border-radius:35px;

border:1px solid #00aaff;

background:rgba(0,0,0,.5);

color:white;

font-size:18px;

font-weight:bold;

}



.main{

background:linear-gradient(
90deg,
#008cff,
#00d5ff
);

}



.status{

margin-top:25px;

color:#bbb;

}



.online{

color:#00ff66;

}


</style>

</head>


<body>


<div class="menu">
☰
</div>



<div class="container">


<img class="logo" src="logopng.jpg">



<h1>
<span>DCT</span>-MD
</h1>


<p class="sub">
ADVANCED BOT SOLUTION
</p>


<div class="line"></div>



<div class="feature">

💎 MOST USEFUL FEATURES

</div>



<button class="main">
🔗 LINK DEVICE
</button>



<button>
🔗 LINK DEVICE 2
</button>



<button>
⚙️ BOT SETTINGS
</button>



<div class="status">

🟢 <span class="online">
SERVER ONLINE
</span>

&nbsp; | &nbsp;

🛡 SECURE

&nbsp; | &nbsp;

V3.0.0


</div>


</div>


</body>
</html>
