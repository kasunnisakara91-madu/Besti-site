<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADUSANKA-MD DCT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
}

body{
    background:#000;
    color:#00ff66;
    font-family:"Courier New",monospace;
    overflow-x:hidden;
}

/* CRT */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(0,255,80,.035) 0px,
        rgba(0,255,80,.035) 1px,
        transparent 1px,
        transparent 4px
    );
}

/* Glow */

body::after{
    content:"";
    position:fixed;

    width:520px;
    height:520px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    background:rgba(0,255,80,.08);
    filter:blur(110px);

    pointer-events:none;
    z-index:-1;
}

/* =========================
   ADMIN BUTTON
========================= */

.admin-panel{
    position:fixed;

    top:18px;
    right:18px;

    z-index:40;
}

.admin-btn{
    display:flex;
    align-items:center;
    gap:8px;

    padding:10px 14px;

    background:rgba(0,0,0,.9);

    color:#00ff66;

    border:1px solid #00ff66;

    border-radius:9px;

    font-family:"Courier New",monospace;

    font-size:11px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 0 8px rgba(0,255,100,.4);

    transition:.3s;
}

.admin-btn:hover{
    background:#00ff66;
    color:#000;

    box-shadow:
        0 0 10px #00ff66,
        0 0 25px #00ff66;
}

.admin-icon{
    font-size:14px;
}

/* Main */

.container{
    width:92%;
    max-width:700px;
    margin:auto;
    text-align:center;
}

/* Header */

.header{
    padding:55px 5px 45px;
}

.logo{
    font-size:38px;
    font-weight:bold;
    line-height:1.4;

    color:#00ff66;
    letter-spacing:3px;

    text-shadow:
        3px 0 #ff003c,
        -3px 0 #00ffff,
        0 0 8px #00ff66,
        0 0 20px #00ff66;

    animation:glitch 3s infinite;
}

.logo2{
    font-size:38px;
    font-weight:bold;

    color:#00ff66;

    text-shadow:
        3px 0 #ff003c,
        -3px 0 #00ffff,
        0 0 15px #00ff66;

    margin-top:2px;
}

.sub{
    margin-top:12px;

    font-size:16px;
    letter-spacing:5px;

    color:#00c94f;

    text-shadow:0 0 8px #00ff66;
}

/* Main Card */

.card{
    position:relative;

    border:2px solid #00ff66;

    border-radius:32px;

    padding:55px 30px 45px;

    background:
        linear-gradient(
            135deg,
            rgba(0,255,80,.04),
            rgba(0,0,0,.98)
        );

    box-shadow:
        0 0 8px #00ff66,
        0 0 25px rgba(0,255,80,.5),
        0 0 70px rgba(0,255,80,.2),
        inset 0 0 30px rgba(0,255,80,.05);

    overflow:hidden;
}

/* Moving Scan */

.card::after{
    content:"";

    position:absolute;

    left:0;
    top:-100%;

    width:100%;
    height:80px;

    background:linear-gradient(
        transparent,
        rgba(0,255,100,.08),
        transparent
    );

    animation:cardScan 5s linear infinite;

    pointer-events:none;
}

@keyframes cardScan{

    0%{
        top:-100px;
    }

    100%{
        top:110%;
    }

}

/* Main Title */

.main-title{
    font-size:38px;
    font-weight:bold;

    line-height:1.35;

    color:#00ff66;

    text-shadow:
        3px 0 #ff003c,
        -3px 0 #00ffff,
        0 0 8px #00ff66,
        0 0 20px #00ff66;

    margin-bottom:20px;

    animation:glitch 3s infinite;
}

/* System */

.system{
    font-size:17px;

    line-height:2;

    color:#00d957;

    margin-bottom:38px;

    text-shadow:0 0 8px rgba(0,255,100,.5);
}

.system span{
    color:#00ff66;

    text-shadow:
        0 0 5px #00ff66,
        0 0 12px #00ff66;
}

/* Button */

.open-btn{
    width:78%;
    max-width:430px;

    height:62px;

    background:transparent;

    color:#00ff66;

    border:2px solid #00ff66;

    border-radius:12px;

    font-family:"Courier New",monospace;

    font-size:17px;
    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 0 8px rgba(0,255,100,.5);
}

.open-btn:hover{

    background:#00ff66;

    color:#000;

    box-shadow:
        0 0 10px #00ff66,
        0 0 30px #00ff66,
        0 0 60px rgba(0,255,100,.5);

}

.open-btn:active{
    transform:scale(.96);
}

/* Skills */

.skills{
    margin-top:38px;

    border-top:1px solid rgba(0,255,100,.2);

    padding-top:28px;
}

.skills-title{
    font-size:15px;

    letter-spacing:5px;

    color:#00d957;

    margin-bottom:18px;

    text-shadow:0 0 8px #00ff66;
}

.skill-list{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;
}

.skill{
    padding:11px 15px;

    border:1px solid #00b94b;

    border-radius:8px;

    background:rgba(0,255,80,.025);

    color:#00ff66;

    font-size:12px;

    letter-spacing:1px;

    box-shadow:
        0 0 7px rgba(0,255,100,.2);

    transition:.3s;
}

.skill:hover{
    border-color:#00ff66;

    box-shadow:
        0 0 12px #00ff66;

    transform:translateY(-3px);
}

/* Clock */

.clock-box{
    margin-top:30px;

    padding:22px 15px;

    border:1px solid #008f3b;

    border-radius:15px;

    background:rgba(0,255,80,.025);

    box-shadow:
        inset 0 0 20px rgba(0,255,100,.04),
        0 0 10px rgba(0,255,100,.15);
}

.clock-label{
    font-size:11px;

    letter-spacing:4px;

    color:#008f3b;

    margin-bottom:10px;
}

#clock{
    font-size:29px;

    font-weight:bold;

    letter-spacing:4px;

    color:#00ff66;

    text-shadow:
        0 0 5px #00ff66,
        0 0 15px #00ff66,
        0 0 30px #00ff66;
}

#date{
    margin-top:8px;

    font-size:11px;

    letter-spacing:2px;

    color:#36a85b;
}

/* Bottom */

.bottom{
    margin-top:35px;

    font-size:13px;

    letter-spacing:2px;

    color:#008f3b;

    line-height:2;
}

.bottom span{
    color:#00ff66;
}

/* Glitch */

@keyframes glitch{

    0%,85%,100%{
        transform:translate(0);
    }

    86%{
        transform:translate(-2px,1px);
    }

    87%{
        transform:translate(3px,-1px);
    }

    88%{
        transform:translate(-1px,2px);
    }

    89%{
        transform:translate(0);
    }

}

/* Mobile */

@media(max-width:600px){

    .container{
        width:90%;
    }

    .admin-panel{
        top:12px;
        right:12px;
    }

    .admin-btn{
        padding:8px 10px;
        font-size:9px;
    }

    .header{
        padding-top:60px;
        padding-bottom:38px;
    }

    .logo{
        font-size:27px;
    }

    .logo2{
        font-size:27px;
    }

    .sub{
        font-size:12px;
        letter-spacing:3px;
    }

    .card{
        padding:48px 18px 40px;
        border-radius:28px;
    }

    .main-title{
        font-size:29px;
    }

    .system{
        font-size:15px;
    }

    .open-btn{
        width:88%;
        height:58px;
        font-size:14px;
    }

    #clock{
        font-size:24px;
    }

    .skill{
        font-size:11px;
        padding:10px 12px;
    }

    .bottom{
        font-size:11px;
    }

}

</style>
</head>

<body>

<!-- =========================
     ADMIN PANEL BUTTON
========================= -->

<div class="admin-panel">

    <button
        class="admin-btn"
        onclick="openAdmin()"
    >
        <span class="admin-icon">⚙</span>
        BOT SETTING
    </button>

</div>


<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            I AM : ( 𝑫𝑬𝑽𝑰𝑳-𝑿-𝑴𝑫 )
        </div>

        <div class="logo2">
            🪷
        </div>

        <div class="sub">
            [ 𝑫𝑬𝑽𝑰𝑳-𝑿-𝑴𝑫 ]
        </div>

    </div>


    <!-- CARD -->

    <div class="card">

        <div class="main-title">
            I AM : ( 𝑫𝑬𝑽𝑰𝑳-𝑿-𝑴𝑫 )
        </div>


        <div class="system">

            &gt; SYSTEM STATUS:
            <span>ONLINE</span>

            <br>

            &gt; ACCESS LEVEL:
            <span>ROOT</span>

        </div>


        <!-- BOT BUTTON -->

        <button
            class="open-btn"
            onclick="openBot()"
        >
            &gt;&gt; OPEN BOT
        </button>


        <!-- SKILLS -->

        <div class="skills">

            <div class="skills-title">
                [ SYSTEM SKILLS ]
            </div>

            <div class="skill-list">

                <div class="skill">
                    MEDIA
                </div>

                <div class="skill">
                    COMMANDS
                </div>

                <div class="skill">
                    DOWNLOAD
                </div>

                <div class="skill">
                    SEARCH
                </div>

                <div class="skill">
                    AUTO REPLY
                </div>

                <div class="skill">
                    WHATSAPP
                </div>

            </div>

        </div>


        <!-- CLOCK -->

        <div class="clock-box">

            <div class="clock-label">
                [ SYSTEM CLOCK ]
            </div>

            <div id="clock">
                00:00:00
            </div>

            <div id="date">
                LOADING...
            </div>

        </div>


        <!-- STATUS -->

        <div class="bottom">

            &gt; BOT NETWORK:
            <span>ONLINE</span>

            <br>

            &gt; CONNECTION:
            <span>ACTIVE</span>

        </div>

    </div>

</div>


<script>

/* =========================
   BOT LINK
========================= */

const BOT_LINK =
"https://cine-hub-production.up.railway.app/";


/* =========================
   ADMIN PANEL LINK
========================= */

const ADMIN_LINK =
"https://your-admin-panel-link.com/";


/* =========================
   OPEN BOT
========================= */

function openBot(){

    window.location.href = BOT_LINK;

}


/* =========================
   OPEN ADMIN PANEL
========================= */

function openAdmin(){

    window.location.href = ADMIN_LINK;

}


/* =========================
   LIVE CLOCK
========================= */

function updateClock(){

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    hours =
        hours < 10
        ? "0" + hours
        : hours;

    minutes =
        minutes < 10
        ? "0" + minutes
        : minutes;

    seconds =
        seconds < 10
        ? "0" + seconds
        : seconds;


    document.getElementById("clock").textContent =
        hours + ":" + minutes + ":" + seconds;


    const days = [
        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"
    ];


    const months = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"
    ];


    const dateText =
        days[now.getDay()]
        + " • "
        + String(now.getDate()).padStart(2,"0")
        + " "
        + months[now.getMonth()]
        + " "
        + now.getFullYear();


    document.getElementById("date").textContent =
        dateText;

}


updateClock();

setInterval(updateClock,1000);

</script>

</body>
  </html>
